name: IntruVert Networks
description: 'IntruVert Networks was a network intrusion-prevention company founded in 2000 in San Jose,
  California, and backed by Trinity Ventures. Its IntruShield product line combined purpose-built inline
  intrusion-prevention appliances with the IntruShield Manager to detect and block network attacks in
  real time. McAfee (then Network Associates) acquired IntruVert in May 2003 for approximately $103 million,
  folding the technology into its intrusion-prevention portfolio. The company no longer operates independently
  and publishes no live developer or API surface; this record is retained for historical/portfolio-graph
  purposes only.'
